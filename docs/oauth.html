<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Obsidian Sync sign-in</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --accent: #7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #a1a1a6; --accent: #a78bfa; } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 420px; margin: 0 auto; }
  a.button { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 10px;
             background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  p.muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to Obsidian…</h1>
  <p id="message">If Obsidian does not open, tap the button.</p>
  <a class="button" id="open" href="#">Open Obsidian</a>
  <p class="muted">This page only forwards the sign-in response to the Obsidian app. It stores and sends nothing.</p>
</main>
<script>
  // Google redirects here with ?code=…&state=… (or ?error=…). Forward them to the plugin's protocol handler.
  var params = new URLSearchParams(window.location.search);
  var forward = new URLSearchParams();
  ["code", "state", "error"].forEach(function (key) {
    var value = params.get(key);
    if (value) forward.set(key, value);
  });
  var target = "obsidian://gdrive-sync-auth?" + forward.toString();
  // Drop the code from the address bar and history.
  history.replaceState(null, "", window.location.pathname);

  if (!forward.has("state")) {
    document.getElementById("title").textContent = "Nothing to do here";
    document.getElementById("message").textContent = "Start sign-in from the Google Drive Sync plugin settings in Obsidian.";
    document.getElementById("open").style.display = "none";
  } else {
    if (params.get("error")) document.getElementById("title").textContent = "Sign-in was cancelled";
    document.getElementById("open").href = target;
    window.location.href = target;
  }
</script>
</body>
</html>
